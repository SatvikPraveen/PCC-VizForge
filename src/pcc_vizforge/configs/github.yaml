# GitHub Statistics Configuration
data_generation:
  n_repositories: 500
  languages:
    [
      "Python",
      "JavaScript",
      "TypeScript",
      "Java",
      "Go",
      "Rust",
      "C++",
      "HTML",
      "CSS",
    ]
  language_weights: null # null = uniform
  reference_date: "2024-01-01" # all dates are relative to this (reproducible)
  max_age_days: 3650
  activity_days: 365
  random_seed: 42

  # Heavy-tailed popularity: latent Pareto(alpha) -> Poisson star counts,
  # so stars inherit a power-law tail with pdf exponent alpha.
  popularity_exponent: 2.0
  stars_scale: 2.0
  age_exponent: 0.5 # stars grow ~ age^0.5
  fork_ratio_beta: [2.0, 10.0] # per-repo fork propensity ~ Beta(a, b)
  contributors_scale: 0.5
  commits_per_day: 0.3
  commits_dispersion: 1.5 # negative-binomial k (smaller = more overdispersed)

visualization:
  matplotlib:
    figsize: [16, 12]
    title: "GitHub Repository Analytics"
    primary_color: "#2a78d6"
    secondary_color: "#eb6834"
    success_color: "#1baf7a"
    warning_color: "#eda100"
    danger_color: "#e87ba4"
    grid: true
    alpha: 0.8

  plotly:
    title: "Interactive GitHub Dashboard"
    width: 1200
    height: 900
    color_discrete_sequence:
      ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300"]
    template: "pcc"

export:
  filename_prefix: "github_analytics"
  image_format: "png"
  image_dpi: 300
  html_include_plotlyjs: "cdn"
