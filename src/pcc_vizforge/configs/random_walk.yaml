# Random Walk Configuration
data_generation:
  n_steps: 1000
  n_walks: 5
  step_size: 1.0 # RMS single-step displacement, a
  random_seed: 42
  dimensions: 1 # 1, 2 or 3
  # One of: lattice | gaussian | correlated | levy | fbm
  model: lattice
  hurst: 0.5 # fbm only: Hurst exponent H in (0, 1); MSD ~ t^(2H)
  levy_alpha: 1.5 # levy only: Pareto tail index in (0, 2]
  persistence: 0.0 # correlated only: velocity autocorrelation rho in (-1, 1)

visualization:
  matplotlib:
    figsize: [12, 8]
    title: "Random Walk Simulation"
    xlabel: "Steps"
    ylabel: "Position"
    color_scheme: ["#1f77b4", "#ff7f0e", "#2ca02c", "#d62728", "#9467bd"]
    line_style: "-"
    line_width: 2
    grid: true
    legend: true
    alpha: 0.8

  plotly:
    title: "Interactive Random Walk Simulation"
    xaxis_title: "Steps"
    yaxis_title: "Position"
    width: 900
    height: 600
    color_scheme: ["#1f77b4", "#ff7f0e", "#2ca02c", "#d62728", "#9467bd"]
    line_width: 2
    show_legend: true
    template: "plotly_white"

export:
  filename_prefix: "random_walk"
  image_format: "png"
  image_dpi: 300
  html_include_plotlyjs: "cdn"
