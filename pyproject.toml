[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pcc-vizforge"
dynamic = ["version"]
description = "Reproducible synthetic-data generation, statistical inference and visualisation for canonical stochastic processes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Satvik Praveen", email = "satvikpraveen707@gmail.com" }]
keywords = [
    "stochastic-processes",
    "synthetic-data",
    "random-walk",
    "anomalous-diffusion",
    "gutenberg-richter",
    "power-law",
    "reproducibility",
    "visualization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "plotly>=5.15",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
export = ["kaleido>=0.2.1"]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "hypothesis>=6.80",
]
dev = [
    "pcc-vizforge[test,export]",
    "ruff>=0.5",
    "mypy>=1.8",
    "pandas-stubs",
    "types-PyYAML",
    "pre-commit>=3.5",
    "nbformat>=5.9",
    "nbconvert>=7.0",
    "ipykernel>=6.0",
]

[project.scripts]
pcc-vizforge = "pcc_vizforge.cli:main"

[project.urls]
Homepage = "https://github.com/SatvikPraveen/PCC-VizForge"
Repository = "https://github.com/SatvikPraveen/PCC-VizForge"
Issues = "https://github.com/SatvikPraveen/PCC-VizForge/issues"
Changelog = "https://github.com/SatvikPraveen/PCC-VizForge/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/pcc_vizforge/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pcc_vizforge"]

[tool.hatch.build.targets.sdist]
include = ["src/pcc_vizforge", "tests", "README.md", "LICENSE", "CITATION.cff"]

# --------------------------------------------------------------------------- #
# Linting / formatting
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["pcc_vizforge"]

# --------------------------------------------------------------------------- #
# Type checking
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.12"
files = ["src/pcc_vizforge"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

# --------------------------------------------------------------------------- #
# Testing
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "slow: long-running statistical / Monte Carlo tests (deselect with -m 'not slow')",
    "statistical: tests that check a generator or estimator against theory",
    "integration: end-to-end CLI / pipeline tests",
]
filterwarnings = ["error::DeprecationWarning:pcc_vizforge.*"]

[tool.coverage.run]
source = ["pcc_vizforge"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
